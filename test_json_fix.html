<!DOCTYPE html>
<html>
<head>
    <title>Test JSON Fix</title>
</head>
<body>
    <h1>Test Cadet Profile JSON Generation</h1>
    <button id="testBtn">Test Cadet Profile Generation</button>
    <div id="result"></div>

    <script>
        document.getElementById('testBtn').addEventListener('click', function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            fetch('generate_document.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    document_type: 'aer',
                    sub_document: 'cadet_profile'
                })
            })
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text(); // Get as text first to see raw response
            })
            .then(text => {
                console.log('Raw response:', text);
                resultDiv.innerHTML = '<h3>Raw Response:</h3><pre>' + text + '</pre>';
                
                // Try to parse as JSON
                try {
                    const data = JSON.parse(text);
                    resultDiv.innerHTML += '<h3>Parsed JSON:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    
                    if (data.success) {
                        resultDiv.innerHTML += '<p style="color: green;">✓ JSON parsing successful!</p>';
                    } else {
                        resultDiv.innerHTML += '<p style="color: orange;">⚠ JSON parsed but operation failed: ' + data.message + '</p>';
                    }
                } catch (e) {
                    resultDiv.innerHTML += '<p style="color: red;">✗ JSON parsing failed: ' + e.message + '</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerHTML = '<p style="color: red;">Request failed: ' + error.message + '</p>';
            });
        });
    </script>
</body>
</html>
