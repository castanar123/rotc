<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Dashboard Debug Test</h1>
    
    <div>
        <button onclick="testAPI()">Test API Direct</button>
        <button onclick="testElements()">Test DOM Elements</button>
        <button onclick="clearDebug()">Clear Debug</button>
    </div>
    
    <div id="debug-output"></div>
    
    <script>
        function log(message, type = 'info') {
            const output = document.getElementById('debug-output');
            const div = document.createElement('div');
            div.className = `debug ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            output.appendChild(div);
            console.log(message);
        }
        
        function clearDebug() {
            document.getElementById('debug-output').innerHTML = '';
        }
        
        async function testAPI() {
            log('Testing API directly...');
            try {
                const url = 'session.php?action=get_stats&td=1&semester=1&date=2025-08-08';
                log(`Fetching: ${url}`);
                
                const response = await fetch(url);
                log(`Response status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const text = await response.text();
                log(`Raw response: ${text}`);
                
                const data = JSON.parse(text);
                log(`Parsed data: ${JSON.stringify(data, null, 2)}`);
                
                if (data.success) {
                    log('API call successful!', 'success');
                    log(`Total strength: ${data.stats.total.strength}`);
                    log(`Gender data: ${JSON.stringify(data.stats.by_gender)}`);
                    log(`Platoon data: ${JSON.stringify(data.stats.by_platoon)}`);
                } else {
                    log(`API error: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
        
        function testElements() {
            log('Testing DOM elements...');
            const elements = [
                'total-strength',
                'total-present', 
                'total-absent',
                'attendance-rate',
                'male-present',
                'female-present',
                'male-strength',
                'female-strength',
                'platoon-stats-container',
                'recent-attendance-table'
            ];
            
            elements.forEach(id => {
                const el = document.getElementById(id);
                log(`Element '${id}': ${el ? 'FOUND' : 'NOT FOUND'}`, el ? 'success' : 'error');
            });
        }
        
        // Test on page load
        window.addEventListener('load', () => {
            log('Page loaded, starting tests...');
            testElements();
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
